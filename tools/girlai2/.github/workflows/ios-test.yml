name: iOS Native Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tools/girlai2/ios/**'
      - 'tools/girlai2/.github/workflows/ios-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tools/girlai2/ios/**'
      - 'tools/girlai2/.github/workflows/ios-test.yml'
  workflow_dispatch:

jobs:
  ios-native-tests:
    name: Native iOS Tests (XCTest)
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      
      - name: Install CocoaPods dependencies
        working-directory: tools/girlai2/ios
        run: |
          pod install
      
      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl list devices | grep "iPhone 15"
      
      - name: Run native iOS tests
        working-directory: tools/girlai2
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath ./ios_test_results.xcresult \
            -enableCodeCoverage YES
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: tools/girlai2/ios_test_results.xcresult
          retention-days: 30
      
      - name: Parse test results
        if: always()
        run: |
          # Extract test results from xcresult bundle
          # Note: Requires xcparse or xcresulttool
          if command -v xcparse &> /dev/null; then
            xcparse screenshots tools/girlai2/ios_test_results.xcresult ./screenshots
            xcparse logs tools/girlai2/ios_test_results.xcresult ./logs
          fi
        continue-on-error: true
