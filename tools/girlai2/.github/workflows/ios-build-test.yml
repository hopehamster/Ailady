name: iOS Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual triggering

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: |
          cd tools/girlai2
          flutter pub get
      
      - name: Generate mocks
        run: |
          cd tools/girlai2
          flutter pub run build_runner build --delete-conflicting-outputs || true
      
      - name: Run unit tests
        run: |
          cd tools/girlai2
          flutter test test/unit/
      
      - name: Generate coverage
        run: |
          cd tools/girlai2
          flutter test --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./tools/girlai2/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    needs: unit-tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: |
          cd tools/girlai2
          flutter pub get
          cd ios && pod install
      
      - name: Build iOS (Profile)
        run: |
          cd tools/girlai2
          flutter build ios --profile --no-codesign
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ios-build
          path: tools/girlai2/build/ios/Profile-iphoneos/
          retention-days: 7

  test-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/girlai2/functions/package-lock.json
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Install function dependencies
        run: |
          cd tools/girlai2/functions
          npm ci
      
      - name: Build functions
        run: |
          cd tools/girlai2/functions
          npm run build
      
      - name: Setup Firebase emulators
        run: |
          firebase setup:emulators:firestore
          firebase setup:emulators:functions
          firebase setup:emulators:auth
      
      - name: Start emulators
        run: |
          cd tools/girlai2
          firebase emulators:start --detach
      
      - name: Wait for emulators
        run: sleep 10
      
      - name: Test functions (placeholder)
        run: |
          echo "Function tests would run here"
          # TODO: Add function unit tests
      
      - name: Stop emulators
        run: firebase emulators:exec --only functions,firestore,auth "echo 'Emulators stopped'"

  integration-test:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [unit-tests, build-ios]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: |
          cd tools/girlai2
          flutter pub get
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Setup Firebase emulators
        run: |
          firebase setup:emulators:firestore
          firebase setup:emulators:functions
          firebase setup:emulators:auth
      
      - name: Start emulators
        run: |
          cd tools/girlai2
          firebase emulators:start --detach
      
      - name: Wait for emulators
        run: sleep 10
      
      - name: Run integration tests
        run: |
          cd tools/girlai2
          export FIRESTORE_EMULATOR_HOST="localhost:8080"
          export FIREBASE_AUTH_EMULATOR_HOST="localhost:9099"
          export FIREBASE_FUNCTIONS_EMULATOR_HOST="localhost:5001"
          # TODO: Add integration test files
          # flutter test integration_test/
          echo "Integration tests would run here"
      
      - name: Stop emulators
        run: firebase emulators:exec --only functions,firestore,auth "echo 'Emulators stopped'"

  deploy-functions:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-functions, integration-test]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/girlai2/functions/package-lock.json
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      
      - name: Install function dependencies
        run: |
          cd tools/girlai2/functions
          npm ci
      
      - name: Deploy functions
        run: |
          cd tools/girlai2
          firebase deploy --only functions --project girlai2
