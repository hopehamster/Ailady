name: girlai2
description: "AI Girlfriend App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  provider: ^6.1.2
  dio: ^5.4.1
  shared_preferences: ^2.2.3
  table_calendar: ^3.1.1
  # flutter_unity_widget: ^2022.2.0
  flutter_launcher_icons: ^0.13.1
  in_app_purchase: ^3.1.11
  intl: ^0.19.0
  uuid: ^4.3.3
  timezone: ^0.9.2
  image_picker: ^1.0.7
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.4
  audioplayers: ^5.2.1
  timeago: ^3.6.1
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.7.7+1
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_premium.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon_premium.png"
    background_color: "#E91E63"
    theme_color: "#E91E63"
  windows:
    generate: true
    image_path: "assets/images/icon_premium.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon_premium.png"

