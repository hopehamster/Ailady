name: girlai2
description: "AI Girlfriend App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1+3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  provider: ^6.1.2
  dio: ^5.4.1
  shared_preferences: ^2.2.3
  table_calendar: ^3.1.1
  flutter_launcher_icons: ^0.13.1
  purchases_flutter: ^8.0.0
  purchases_ui_flutter: ^8.11.0
  intl: ^0.19.0
  uuid: ^4.3.3
  timezone: ^0.9.2
  image_picker: ^1.0.7
  camera: ^0.11.0+2
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.4
  path_provider: ^2.1.1
  timeago: ^3.6.1
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.7.7+1
  google_fonts: ^6.3.0
  flutter_otp_kit: ^3.1.1
  just_audio: ^0.9.36
  speech_to_text: ^7.3.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  image: ^4.8.0
  flutter_webrtc: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/live2d/
    - assets/live2d/bezzly/
    - assets/live2d/bezzly/bezzly.8192/
    - assets/audio/fillers/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_premium.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icon_premium.png"
    background_color: "#E91E63"
    theme_color: "#E91E63"
  windows:
    generate: true
    image_path: "assets/images/icon_premium.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icon_premium.png"

