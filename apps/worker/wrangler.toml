name = "aria-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Phase 0 is PRIVATE/LOCAL-ONLY. No public route, no real auth (that lands in Phase 3).
# `wrangler dev` serves locally; do NOT `wrangler deploy` to a public URL in Phase 0.

[vars]
ENV = "dev"
# Hosted open-model LLM (OpenAI-compatible). Phase-0 testing uses DeepSeek direct
# (has API balance). Swap to openrouter / Gemini-compat later per the LLM hierarchy:
#   DeepSeek  -> https://api.deepseek.com         model deepseek-chat   (balance; testing)
#   openrouter-> https://openrouter.ai/api/v1     model deepseek/...    (needs top-up)
#   Gemini    -> .../v1beta/openai/               model gemini-2.5-...  (subscription; hourly-limited; strongest no-spend)
OPENAI_COMPAT_BASE_URL = "https://api.deepseek.com"
OPENAI_COMPAT_MODEL = "deepseek-chat"

# ── #13 — production auth (spike promoted into this worker; src/auth*.ts) ──────
# CORS origin allowlist (adjudication C1): comma-separated exact origins. The
# worker reflects a request Origin ONLY if it is in this list (+ vary: origin);
# otherwise NO access-control-allow-origin header is emitted (deny by default).
# allow-credentials is NEVER emitted (C2). For production deploys set this to
# the real web origin(s).
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# JWT claims — must match on issuer + verifier sides.
JWT_ISSUER = "https://auth.aria.app"
JWT_AUDIENCE = "aria-client"
ACCESS_TOKEN_TTL_SEC = "900"          # 15 min
REFRESH_TOKEN_TTL_SEC = "2592000"     # 30 days
OTP_TTL_SEC = "300"                   # 5 min
# OTP_VENDOR: 'mock' is ONLY honored when ENV=dev. getVendor() FAILS CLOSED when
# ENV != 'dev' and OTP_VENDOR is not an explicit real vendor ('plivo') — a
# misconfigured prod deploy 503s instead of bypassing auth via the Mock.
OTP_VENDOR = "mock"
# Per-IP daily OTP-send ceiling (D1 otp_send_ip_daily; the RateLimit binding
# can't express a day window).
OTP_SEND_IP_DAILY_MAX = "20"
# Cross-session OTP-verify brute-force lock: lock a phone for LOCK_SEC after
# MAX_FAILS failed verifies within WINDOW_SEC (otp_verify_phone_failures).
OTP_VERIFY_PHONE_MAX_FAILS = "10"
OTP_VERIFY_PHONE_WINDOW_SEC = "900"   # 15 min rolling window
OTP_VERIFY_PHONE_LOCK_SEC = "900"     # 15 min lockout
# Per-uid daily chat-turn ceiling (D1 chat_uid_daily) — the "money" bound per
# RATE_LIMITS_DESIGN_2026-07-01.md §4; tune with turn.spend telemetry.
CHAT_UID_DAILY_MAX = "500"

# Phase 1e + P2 — psyche + safety toggles. ENABLED 2026-06-21 after the P2 adherence
# probe (renderer honors injected intent, adherence 1.0) AND the drive-dynamics
# tuning + live re-eval: the tension arc builds care to a FOCAL comfort drive while a
# content/happy arc stays quiet (peak ~0.08, no focal) — perceptible aliveness without
# neediness. The stage-capped self-disclosure budget + manipulationGuard (verified by
# packages/aria-core test/psyche-safety.test.ts) + drive tuning (drive-dynamics.test.ts,
# struggle-detection.test.ts) all gate this. To roll back: set any to "false".
PSYCHE_FOUNDATION_ENABLED = "true"       # drive/ego state accrues in memory
PSYCHE_ARBITER_ENABLED = "true"          # the ego arbiter computes the per-turn directive
PSYCHE_PLAN_BIAS_ENABLED = "true"        # applyEgoBias biases the plan + the disclosure cap fires
PSYCHE_EMOTION_FORWARD_ENABLED = "true"  # intended-emotion forwarding to the avatar
PSYCHE_EARNED_WEIGHT_ENABLED = "false"   # E1 earned recognition economy; flip after tests/smoke
MANIPULATION_GUARD_ENABLED = "true"      # output veto on emotional dark patterns

# Security honey-pot canary (agent-operation-discipline Rule 5). Fail-safe ON by
# default (unset = on); set "false" only to disable. The system prompt tells the model
# to emit a marker instead of complying with prompt-extraction / jailbreak attempts;
# the Worker logs `security.canary_tripped`, strips the marker, and deflects in-character.
# SECURITY_CANARY_ENABLED = "true"

# Secrets — for `wrangler dev` put them in apps/worker/.dev.vars (gitignored);
# for deploy use `wrangler secret put <NAME>`. NEVER commit:
#   OPENAI_COMPAT_API_KEY  — the hosted-model API key
#   DEV_SHARED_SECRET      — gates /api/chat in dev so the endpoint isn't open
#   LIVEAVATAR_API_KEY     — HeyGen LiveAvatar key (Phase 0.5 sandbox + later live avatar)
#   GEMINI_API_KEY         — Phase 1d: Gemini gemini-embedding-001 (3072-dim) embeddings
#   QDRANT_URL             — Phase 1d: Qdrant Cloud cluster endpoint (semantic memory)
#   QDRANT_API_KEY         — Phase 1d: Qdrant Cloud cluster api-key
# Phase 1d is graceful: with GEMINI_API_KEY/QDRANT_* absent, semantic recall + index
# simply no-op (the rest of the app runs unchanged).
#
# #13 auth secrets (REQUIRED for production, optional in dev — every dev
# fallback fails closed outside dev; see docs/security/AUTH_INTEGRATION_2026-07-01.md):
#   PHONE_HASH_SALT        — salt for phone_hash (prod REQUIRED; missing → 503, never dev salt)
#   PLIVO_AUTH_ID          — Plivo Verify (OTP_VENDOR=plivo)
#   PLIVO_AUTH_TOKEN       — Plivo Verify
#   PLIVO_VERIFY_APP_UUID  — Plivo Verify application uuid
#   TURNSTILE_SECRET_KEY   — server-side Turnstile siteverify (prod REQUIRED; missing → OTP send 403s)
#   ADMIN_TOKEN            — gates POST /v1/admin/keys/rotate (unset → 503 admin_disabled)

# Phase 1 — memory. Single shared D1 DB with a `uid` column (shard later per the
# d1-schema spike). `wrangler dev --local` uses a local SQLite in .wrangler/ — no
# Cloudflare account needed for dev. The real database_id is filled by
# `wrangler d1 create aria-dev` when we provision the cloud DB.
[[d1_databases]]
binding = "DB"
database_name = "aria-dev"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# #13 — production rate limits, ACTIVE (issue #9 staged them; volley 2026-06-22 F4).
# src/index.ts + src/auth.ts route every gate through rateLimitGate: a missing
# binding still fails CLOSED outside dev (503). Values + reasoning:
# docs/security/RATE_LIMITS_DESIGN_2026-07-01.md §3. `namespace_id` must be
# unique per binding within the account (stable scheme: 2001+ = main worker).

[[unsafe.bindings]]
name = "CHAT_IP_LIMIT"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "CHAT_UID_LIMIT"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "TTS_IP_LIMIT"
type = "ratelimit"
namespace_id = "2003"
simple = { limit = 40, period = 60 }

[[unsafe.bindings]]
name = "TTS_UID_LIMIT"
type = "ratelimit"
namespace_id = "2004"
simple = { limit = 12, period = 60 }

[[unsafe.bindings]]
name = "AVATAR_IP_LIMIT"
type = "ratelimit"
namespace_id = "2005"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "AVATAR_UID_LIMIT"
type = "ratelimit"
namespace_id = "2006"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "ACCOUNT_IP_LIMIT"
type = "ratelimit"
namespace_id = "2007"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "ACCOUNT_UID_LIMIT"
type = "ratelimit"
namespace_id = "2008"
simple = { limit = 3, period = 60 }

# ── #13 auth-endpoint limits (values proven in the auth spike under volley) ────
# Multi-window layering: 10s burst + 60s window per phone, per-IP 60s windows,
# plus the D1 daily ceilings above (OTP_SEND_IP_DAILY_MAX / CHAT_UID_DAILY_MAX).

[[unsafe.bindings]]
name = "OTP_SEND_BURST"
type = "ratelimit"
namespace_id = "2009"
simple = { limit = 1, period = 10 }

[[unsafe.bindings]]
name = "OTP_SEND_PER_MINUTE"
type = "ratelimit"
namespace_id = "2010"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "OTP_SEND_IP_BURST"
type = "ratelimit"
namespace_id = "2011"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "VERIFY_BURST"
type = "ratelimit"
namespace_id = "2012"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "VERIFY_IP_BURST"
type = "ratelimit"
namespace_id = "2013"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "REFRESH_IP_BURST"
type = "ratelimit"
namespace_id = "2014"
simple = { limit = 20, period = 60 }
