name = "aria-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Phase 0 is PRIVATE/LOCAL-ONLY. No public route, no real auth (that lands in Phase 3).
# `wrangler dev` serves locally; do NOT `wrangler deploy` to a public URL in Phase 0.

[vars]
ENV = "dev"
# Hosted open-model LLM (OpenAI-compatible). Phase-0 testing uses DeepSeek direct
# (has API balance). Swap to openrouter / Gemini-compat later per the LLM hierarchy:
#   DeepSeek  -> https://api.deepseek.com         model deepseek-chat   (balance; testing)
#   openrouter-> https://openrouter.ai/api/v1     model deepseek/...    (needs top-up)
#   Gemini    -> .../v1beta/openai/               model gemini-2.5-...  (subscription; hourly-limited; strongest no-spend)
OPENAI_COMPAT_BASE_URL = "https://api.deepseek.com"
OPENAI_COMPAT_MODEL = "deepseek-chat"

# Phase 1e + P2 — psyche + safety toggles. ENABLED 2026-06-21 after the P2 adherence
# probe (renderer honors injected intent, adherence 1.0) AND the drive-dynamics
# tuning + live re-eval: the tension arc builds care to a FOCAL comfort drive while a
# content/happy arc stays quiet (peak ~0.08, no focal) — perceptible aliveness without
# neediness. The stage-capped self-disclosure budget + manipulationGuard (verified by
# packages/aria-core test/psyche-safety.test.ts) + drive tuning (drive-dynamics.test.ts,
# struggle-detection.test.ts) all gate this. To roll back: set any to "false".
PSYCHE_FOUNDATION_ENABLED = "true"       # drive/ego state accrues in memory
PSYCHE_ARBITER_ENABLED = "true"          # the ego arbiter computes the per-turn directive
PSYCHE_PLAN_BIAS_ENABLED = "true"        # applyEgoBias biases the plan + the disclosure cap fires
PSYCHE_EMOTION_FORWARD_ENABLED = "true"  # intended-emotion forwarding to the avatar
MANIPULATION_GUARD_ENABLED = "true"      # output veto on emotional dark patterns

# Secrets — for `wrangler dev` put them in apps/worker/.dev.vars (gitignored);
# for deploy use `wrangler secret put <NAME>`. NEVER commit:
#   OPENAI_COMPAT_API_KEY  — the hosted-model API key
#   DEV_SHARED_SECRET      — gates /api/chat in dev so the endpoint isn't open
#   LIVEAVATAR_API_KEY     — HeyGen LiveAvatar key (Phase 0.5 sandbox + later live avatar)
#   GEMINI_API_KEY         — Phase 1d: Gemini gemini-embedding-001 (3072-dim) embeddings
#   QDRANT_URL             — Phase 1d: Qdrant Cloud cluster endpoint (semantic memory)
#   QDRANT_API_KEY         — Phase 1d: Qdrant Cloud cluster api-key
# Phase 1d is graceful: with GEMINI_API_KEY/QDRANT_* absent, semantic recall + index
# simply no-op (the rest of the app runs unchanged).

# Phase 1 — memory. Single shared D1 DB with a `uid` column (shard later per the
# d1-schema spike). `wrangler dev --local` uses a local SQLite in .wrangler/ — no
# Cloudflare account needed for dev. The real database_id is filled by
# `wrangler d1 create aria-dev` when we provision the cloud DB.
[[d1_databases]]
binding = "DB"
database_name = "aria-dev"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"
